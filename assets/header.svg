<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Astha Katiyar - Full-Stack Developer and AI Engineer</title>
  <desc id="d">Animated banner with the name Astha Katiyar and rotating roles</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#1B1145"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7C3AED" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <circle cx="180" cy="80" r="110" fill="#7C3AED" opacity="0.55" filter="url(#blur)">
      <animate attributeName="cx" values="180;320;180" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;150;80" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="250" r="120" fill="#22D3EE" opacity="0.38" filter="url(#blur)">
      <animate attributeName="cx" values="1020;880;1020" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;170;250" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="40" r="80" fill="#F472B6" opacity="0.25" filter="url(#blur)">
      <animate attributeName="cx" values="700;800;700" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- floating code glyphs -->
    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="26" fill="#C4B5FD" opacity="0.35">
      <text x="90" y="270">&lt;/&gt;
        <animate attributeName="y" values="270;250;270" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="1040" y="90">{ }
        <animate attributeName="y" values="90;110;90" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="960" y="280">AI
        <animate attributeName="y" values="280;262;280" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="130" y="60">=&gt;
        <animate attributeName="y" values="60;78;60" dur="6.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- greeting -->
    <text x="600" y="98" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="20" fill="#67E8F9" letter-spacing="4">HELLO WORLD, I AM</text>

    <!-- name -->
    <text x="600" y="172" text-anchor="middle" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="74" font-weight="800" fill="url(#name)" letter-spacing="3">ASTHA KATIYAR</text>

    <rect x="470" y="190" width="260" height="4" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="60;260;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="570;470;570" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- rotating roles -->
    <g font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#E5E7EB" text-anchor="middle">
      <text x="600" y="244" opacity="1">Full-Stack Developer
        <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.33;0.66;0.9;0.97;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="244" opacity="0">AI &amp; Machine Learning Enthusiast
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.61;0.67;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="244" opacity="0">Building products that think
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.63;0.69;0.94;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="600" y="284" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" fill="#9CA3AF" letter-spacing="2">B.TECH CSE  ·  PSIT KANPUR  ·  REACT  ·  NODE.JS  ·  PYTHON</text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="none" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="2"/>
</svg>
