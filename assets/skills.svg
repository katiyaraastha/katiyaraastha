        <rect x="354" y="62" width="70" height="32" rx="16" fill="none" stroke="#EC4899" stroke-dasharray="4 4"/><text x="389" y="83" fill="#F9A8D4">NLP</text>
        <rect x="22" y="106" width="110" height="32" rx="16" fill="none" stroke="#EC4899" stroke-dasharray="4 4"/><text x="77" y="127" fill="#F9A8D4">LLM APIs</text>
        <rect x="142" y="106" width="150" height="32" rx="16" fill="none" stroke="#EC4899" stroke-dasharray="4 4"/><text x="217" y="127" fill="#F9A8D4">Prompt Design</text>
