        <rect x="108" y="62" width="70" height="32" rx="16" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED"/><text x="143" y="83" fill="#DDD6FE">CSS3</text>
        <rect x="188" y="62" width="112" height="32" rx="16" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED"/><text x="244" y="83" fill="#DDD6FE">JavaScript</text>
