        <rect x="102" y="62" width="70" height="32" rx="16" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4"/><text x="137" y="83" fill="#CFFAFE">Git</text>
        <rect x="182" y="62" width="92" height="32" rx="16" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4"/><text x="228" y="83" fill="#CFFAFE">GitHub</text>
        <rect x="284" y="62" width="140" height="32" rx="16" fill="none" stroke="#06B6D4" stroke-dasharray="4 4"/><text x="354" y="83" fill="#67E8F9">Data Structures</text>
