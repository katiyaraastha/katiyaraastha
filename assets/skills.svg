    <!-- legend -->
    <g font-size="14" fill="#9CA3AF" text-anchor="start">
      <rect x="30" y="428" width="44" height="20" rx="10" fill="#7C3AED" fill-opacity="0.2" stroke="#7C3AED"/>
      <text x="84" y="443">In my toolkit (solid)</text>
      <rect x="260" y="428" width="44" height="20" rx="10" fill="none" stroke="#A78BFA" stroke-dasharray="4 4"/>
      <text x="314" y="443">Actively learning (dashed)</text>
      <text x="970" y="443" text-anchor="end" fill="#6B7280">Updated as I grow</text>
