<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t">
  <title id="t">Skills grouped by Frontend, Backend and Data, AI and ML, and Foundations</title>
  <defs>
