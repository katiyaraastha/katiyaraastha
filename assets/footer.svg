<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="t">
  <title id="t">Build. Learn. Ship. footer with animated waves</title>
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.6"/><stop offset="1" stop-color="#EC4899" stop-opacity="0.6"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="200" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="200" fill="#0B1020"/>
    <path fill="url(#w2)" d="M0 110C150 70 300 150 450 110S750 70 900 110 1050 150 1200 110V200H0Z">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 110C150 70 300 150 450 110S750 70 900 110 1050 150 1200 110V200H0Z;M0 110C150 150 300 70 450 110S750 150 900 110 1050 70 1200 110V200H0Z;M0 110C150 70 300 150 450 110S750 70 900 110 1050 150 1200 110V200H0Z"/>
    </path>
    <path fill="url(#w1)" opacity="0.85" d="M0 140C200 110 300 170 500 140S800 110 1000 140 1100 160 1200 140V200H0Z">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 140C200 110 300 170 500 140S800 110 1000 140 1100 160 1200 140V200H0Z;M0 140C200 170 300 110 500 140S800 170 1000 140 1100 120 1200 140V200H0Z;M0 140C200 110 300 170 500 140S800 110 1000 140 1100 160 1200 140V200H0Z"/>
    </path>
    <text x="600" y="62" text-anchor="middle" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="6">BUILD. LEARN. SHIP.</text>
    <text x="600" y="92" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" fill="#C4B5FD" letter-spacing="2">Thanks for stopping by. Let's build something great together.</text>
  </g>
</svg>
