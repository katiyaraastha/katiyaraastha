<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="t">
  <title id="t">Roadmap: Now, Building, Next</title>
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="330" rx="18" fill="#0B1020"/>
  <rect x="1" y="1" width="998" height="328" rx="18" fill="none" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="2"/>

  <!-- track -->
  <rect x="60" y="56" width="880" height="6" rx="3" fill="url(#track)" opacity="0.9"/>
  <circle r="9" cy="59" fill="#FFFFFF">
    <animate attributeName="cx" values="60;940;60" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">
    <!-- NOW -->
    <circle cx="176" cy="59" r="14" fill="#22C55E"/>
    <circle cx="176" cy="59" r="14" fill="none" stroke="#22C55E" stroke-width="2">
      <animate attributeName="r" values="14;26;14" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="30" y="95" width="290" height="205" rx="14" fill="#111827" stroke="#22C55E" stroke-opacity="0.6"/>
    <text x="52" y="128" font-size="13" font-weight="700" fill="#22C55E" letter-spacing="3">🟢 NOW</text>
    <text x="52" y="156" font-size="20" font-weight="700" fill="#FFFFFF">Strong foundations</text>
    <g font-size="15" fill="#D1D5DB">
      <text x="52" y="188">▸ Core web: HTML, CSS, JavaScript</text>
      <text x="52" y="214">▸ React and component thinking</text>
      <text x="52" y="240">▸ Python and C++ problem solving</text>
      <text x="52" y="266">▸ Git and GitHub workflow</text>
    </g>

    <!-- BUILDING -->
    <circle cx="500" cy="59" r="14" fill="#3B82F6"/>
    <circle cx="500" cy="59" r="14" fill="none" stroke="#3B82F6" stroke-width="2">
      <animate attributeName="r" values="14;26;14" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <rect x="355" y="95" width="290" height="205" rx="14" fill="#111827" stroke="#3B82F6" stroke-opacity="0.6"/>
    <text x="377" y="128" font-size="13" font-weight="700" fill="#60A5FA" letter-spacing="3">🔵 BUILDING</text>
    <text x="377" y="156" font-size="20" font-weight="700" fill="#FFFFFF">Full-stack projects</text>
    <g font-size="15" fill="#D1D5DB">
      <text x="377" y="188">▸ Jarvo, AI desktop voice assistant</text>
      <text x="377" y="214">▸ Node.js backends and REST APIs</text>
      <text x="377" y="240">▸ Databases and authentication</text>
      <text x="377" y="266">▸ Data structures and algorithms</text>
    </g>

    <!-- NEXT -->
    <circle cx="824" cy="59" r="14" fill="#A855F7"/>
    <circle cx="824" cy="59" r="14" fill="none" stroke="#A855F7" stroke-width="2">
      <animate attributeName="r" values="14;26;14" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="680" y="95" width="290" height="205" rx="14" fill="#111827" stroke="#A855F7" stroke-opacity="0.6"/>
    <text x="702" y="128" font-size="13" font-weight="700" fill="#C084FC" letter-spacing="3">🟣 NEXT</text>
    <text x="702" y="156" font-size="20" font-weight="700" fill="#FFFFFF">AI-powered products</text>
    <g font-size="15" fill="#D1D5DB">
      <text x="702" y="188">▸ LLM-integrated web apps</text>
      <text x="702" y="214">▸ ML fundamentals to deployment</text>
      <text x="702" y="240">▸ Cloud, Docker and CI/CD</text>
      <text x="702" y="266">▸ Open-source contributions</text>
    </g>
  </g>
</svg>
